      <text x="82" y="132" fill="#E2E8F0">Due diligence: PASS</text>
      <text x="48" y="176" fill="#22D3EE">✓</text>
      <text x="82" y="176" fill="#E2E8F0">Risk classified</text>
      <text x="48" y="220" fill="#22D3EE">✓</text>
      <text x="82" y="220" fill="#E2E8F0">Small safe change</text>
      <text x="48" y="264" fill="#22D3EE">✓</text>
      <text x="82" y="264" fill="#E2E8F0">Verification required</text>
    </g>

    <path d="M340 250L366 276L390 212" stroke="#22D3EE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
