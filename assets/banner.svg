    <circle cx="1528" cy="118" r="2" fill="#FFFFFF"/>
    <circle cx="955" cy="63" r="2" fill="#FFFFFF"/>
    <circle cx="86" cy="426" r="3" fill="#FFFFFF"/>
    <circle cx="742" cy="442" r="2" fill="#FFFFFF"/>
  </g>
