    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.82 0 0 0 0 0.93 0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M 54 0 L 0 0 0 54" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="34" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="34" fill="url(#glow1)"/>
  <rect width="1600" height="500" rx="34" fill="url(#glow2)"/>

  <g opacity="0.75">
    <path d="M1080 120C980 143 900 210 812 250C700 301 585 275 484 335C386 394 332 428 220 420" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>
