      <text x="25" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0">Due Diligence PASS</text>
      <rect x="216" y="0" width="170" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="242" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0">Safe Governance</text>
      <rect x="406" y="0" width="150" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <text x="434" y="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#E2E8F0">Verified Work</text>
