    <rect x="38" y="40" width="354" height="52" rx="16" fill="#0F172A" fill-opacity="0.76" stroke="#22D3EE" stroke-opacity="0.28"/>
    <circle cx="66" cy="66" r="7" fill="#22D3EE"/>
    <circle cx="90" cy="66" r="7" fill="#818CF8"/>
    <circle cx="114" cy="66" r="7" fill="#A855F7"/>
    <text x="145" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="17" font-weight="700" fill="#E2E8F0">MOH_SKILL.md</text>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="600">
